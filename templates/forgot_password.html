<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password | Smart Study Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2,#ff758c)}.card{width:410px;max-width:92%;padding:40px;background:#fff;border-radius:25px;box-shadow:0 25px 60px rgba(0,0,0,.25);text-align:center}.icon{font-size:55px}.title{font-size:29px;font-weight:700;color:#4f46e5;margin:8px 0}.sub{color:#666;line-height:1.5;margin-bottom:25px}.box{text-align:left}label{display:block;font-weight:bold;margin-bottom:7px}input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#667eea}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.error{background:#ffe7e7;color:#b42318;padding:10px;border-radius:10px;margin-bottom:15px;font-size:14px}.back{display:inline-block;margin-top:18px;color:#4f46e5;text-decoration:none;font-weight:bold}.note{margin-top:16px;font-size:12px;color:#888}
</style></head><body><div class="card"><div class="icon">🔑</div><div class="title">Forgot Password?</div><div class="sub">Enter your registered email to get a verification OTP.</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><div class="box"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div><button class="btn" type="submit">Continue →</button></form><div class="note">OTP is shown on the next page in demo mode.</div><a class="back" href="/login">← Back to Login</a></div></body></html>
